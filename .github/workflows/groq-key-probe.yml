name: groq-key-probe

# Temporary diagnostic: checks whether the CI provider secrets still work.
# Lives on a throwaway branch and is deleted after it has run.

on:
  push:
    branches: ["probe/groq-key"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the provider keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_TEST_LOCAL_KEY: ${{ secrets.GROQ_TEST_LOCAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "groq key present: ${GROQ_API_KEY:+yes} (prefix ${GROQ_API_KEY:0:4})"
          echo "gemini key present: ${GEMINI_API_KEY:+yes} (prefix ${GEMINI_API_KEY:0:3})"

          code=$(curl -s -o /tmp/groq.json -w "%{http_code}" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            "https://api.groq.com/openai/v1/models")
          echo "GROQ   /models -> $code"
          head -c 200 /tmp/groq.json; echo

          code3=$(curl -s -o /tmp/groq2.json -w "%{http_code}" \
            -H "Authorization: Bearer $GROQ_TEST_LOCAL_KEY" \
            "https://api.groq.com/openai/v1/models")
          echo "GROQ local-key-copy /models -> $code3"
          head -c 200 /tmp/groq2.json; echo

          code2=$(curl -s -o /tmp/gem.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY")
          echo "GEMINI /models -> $code2"
          head -c 200 /tmp/gem.json; echo
