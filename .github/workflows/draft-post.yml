name: draft-post

# Runs the PortfolioLinker pipeline on a schedule and on demand, and publishes
# automatically when - and only when - the draft clears the quality gate.
#
# The gate is the only thing standing between an automated blog and an
# automated mistake, so nothing here relaxes it. A draft that does not pass is
# saved to drafts/ as a review artifact and the run still succeeds, quietly,
# with nothing published. main.py's exit code is the decision:
#   0 = gate passed -> publish
#   1 = gate failed -> hold for review, publish nothing
#   2 = provider quota exhausted -> hold for review, publish nothing
#
# PUBLISH_LIVE is set to true HERE, in the throwaway .env this job builds from
# secrets. It is never a secret and never comes from your local .env, which
# stays false so local testing is still draft-only by default.

on:
  schedule:
    # Daily, 03:35 UTC (~9:05 AM IST). GitHub cron is UTC-only, runs on best
    # effort (expect drift, and occasional skipped runs), and queues every
    # repo's scheduled jobs into the same minute - hence :35 rather than :00.
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic to write about (blank = pick from the pool)"
        required: false
        type: string

# Never let two runs publish at once. A manual run overlapping a scheduled one
# should queue behind it, not cancel it half way through an API call.
concurrency:
  group: draft-post
  cancel-in-progress: false

# contents: write is required so the ledger can be committed back at the end
# of a run. It is the one privilege this workflow asks for beyond reading the
# repo, and it is what lets a compromised dependency in requirements.txt push
# code. Mitigated as far as is reasonable: the commit step stages ONLY
# posted_topics.json, never `git add -A`.
permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    # Generous, because generation + gate + publish is several LLM round trips.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ledger push below can rebase if your machine
          # pushed in the meantime. A shallow clone cannot rebase.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .env from secrets
        # config.py boots off a .env file, so materialise one from secrets.
        # Every value is masked in logs; the file is never committed.
        #
        # Note the name mismatch: GitHub refuses secret names starting with
        # GITH (reserved), so the secret is PROFILE_GITHUB_URL while the line
        # written into .env is GITHUB_PROFILE_URL, which is what config.py
        # reads.
        run: |
          cat > .env <<EOF
          LLM_PROVIDERS=${{ secrets.LLM_PROVIDERS }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}
          BLOGGER_CLIENT_ID=${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET=${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN=${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID=${{ secrets.BLOGGER_BLOG_ID }}
          PORTFOLIO_URL=${{ secrets.PORTFOLIO_URL }}
          PORTFOLIO_BLOG_PAGE_URL=${{ secrets.PORTFOLIO_BLOG_PAGE_URL }}
          GITHUB_PROFILE_URL=${{ secrets.PROFILE_GITHUB_URL }}
          PUBLISH_LIVE=true
          EOF
          echo "::add-mask::$(grep -E 'KEY|SECRET|TOKEN' .env | tr '\n' ' ')"

      - name: Generate a draft
        id: gen
        # The exit code is the publish decision, so it must survive. `|| true`
        # would have thrown away exactly the signal we need here.
        run: |
          set +e
          if [ -n "${{ inputs.topic }}" ]; then
            python main.py --topic "${{ inputs.topic }}"
          else
            python main.py
          fi
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "gate PASSED - eligible to publish" ;;
            1) echo "::notice::gate did not pass - nothing will be published" ;;
            2) echo "::notice::provider quota exhausted - nothing published" ;;
            *) echo "::warning::unexpected exit code $rc" ;;
          esac
          exit 0

      - name: Verify a draft was produced
        run: |
          if [ ! -f drafts/LATEST.txt ]; then
            echo "::error::pipeline produced no draft at all"
            exit 1
          fi
          echo "latest draft: $(cat drafts/LATEST.txt)"

      - name: Publish the draft
        if: steps.gen.outputs.exit_code == '0'
        # publish_blogger.py re-runs the quality gate and re-checks the
        # fabrication tripwires before it creates anything. Nothing is skipped
        # here: a second independent gate that disagrees simply blocks the
        # publish, which is the correct direction to fail.
        run: |
          stem="$(cat drafts/LATEST.txt)"
          echo "publishing drafts/${stem}.json"
          python publish_blogger.py --draft "drafts/${stem}.json" --publish

      - name: Hold for review
        if: steps.gen.outputs.exit_code != '0'
        run: |
          echo "::notice::The draft did not clear the quality gate, so"
          echo "::notice::nothing was published. It is attached to this run"
          echo "::notice::as an artifact for you to look at."

      - name: Commit the ledger back to the repo
        if: always()
        # posted_topics.json is the shared memory of what has already been
        # written. Without this, a scheduled run records its topic on the
        # runner, that record dies with the runner, and a later local run has
        # no idea the topic was used - so it picks it again.
        #
        # Never let this fail the run: the post is already published by this
        # point, and a lost ledger update is far less bad than a red run.
        run: |
          if git diff --quiet -- posted_topics.json; then
            echo "ledger unchanged (nothing drafted this run) - nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the ledger. Never `git add -A` here: drafts/, images/
          # and .env must never be committed from a runner.
          git add posted_topics.json
          git commit -m "ledger: record topics drafted by CI ($(date -u +%Y-%m-%d))"

          # You may have pushed from your machine while this run was going.
          # Rebase and retry rather than failing on a non-fast-forward.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "ledger pushed to origin/main"
              exit 0
            fi
            echo "push attempt $attempt failed; rebasing onto origin/main"
            git pull --rebase origin main || true
          done

          echo "::warning::could not push the ledger. Your local posted_topics.json"
          echo "::warning::may not know about topics this run already used."

      - name: Upload drafts and images as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drafts
          path: |
            drafts/
            images/
          retention-days: 14
          if-no-files-found: warn